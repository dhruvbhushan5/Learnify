        margin-right: 10px;
        display: block; 
    }

   
    input[type="text"],
    input[type="password"],
    input[type="date"],
    input[type="number"] {
        margin-bottom: 20px; 
        padding: 8px; 
        font-size: 16px; 
        border: 1px solid hsl(220, 20%, 70%);
        border-radius: 5px;
    }

   
    .radio-group {
        display: flex;
        align-items: center;
        gap: 15px; 
        margin-bottom: 20px; 
    }

    .radio-group input[type="radio"] {
        margin-right: 5px; 
    }

    
    form {
        width: 400px; 
        margin: 0 auto; 
        background-color: hsl(0, 0%, 95%);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
    }
</style>

     <form id="userForm" action="/register1" method="post" onsubmit="return validatePassword()">
        <center><br>
            <h1>Sign Up Form</h1><br><br>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required><br><br>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>
            
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>
            <label>Gender:</label>
            <div class="radio-group">
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
            
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </div>
            
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Enter your age" required><br><br>
            
            <button type="submit" class="reg">Register</button>
        </center>
    </form>

    <script>
        function validatePassword() {
            const passwordInput = document.getElementById("password").value;
            const fixedPassword = "dhruv"; 
            
            if (passwordInput !== fixedPassword) {
                window.location.href = "/invalid"; 
                return false; 
            }
            return true;
        }
    </script>
